name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /gs_goodwe/
          # banco de verdade no site publicado: URL e chave publicável são públicas por natureza
          # (vão para o navegador de qualquer jeito). A senha das contas demo NÃO vai: no site,
          # cada aparelho entra uma vez pela tela de entrada e o link ?conta= passa a entrar sozinho.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MODO_DEMO: 'true'
      # o Pages nao tem fallback de SPA; o 404 com o mesmo conteudo cobre as
      # rotas reais (/totem, /franqueado, ...) em acesso direto
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
